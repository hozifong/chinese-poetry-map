<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国古诗地图 - 100首唐宋诗词</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ 中国古诗地图</h1>
            <p>探索100首唐宋诗词所描绘的地点</p>
        </div>
        
        <div class="map-container">
            <svg id="map-svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet"></svg>
            <div id="tooltip"></div>
        </div>

        <div id="poem-modal" class="modal">
            <div class="modal-content">
                <div class="close" onclick="closeModal()">&times;</div>
                <div class="modal-header">
                    <div id="poem-title"></div>
                    <div id="poem-author"></div>
                    <div id="poem-location"></div>
                </div>
                <div class="modal-body">
                    <div id="poem-content"></div>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">100</div>
                <div class="stat-label">古诗</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">31</div>
                <div class="stat-label">省份</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">唐宋</div>
                <div class="stat-label">主要朝代</div>
            </div>
        </div>
    </div>

    <script src="js/map.js"></script>
</body>
</html>
